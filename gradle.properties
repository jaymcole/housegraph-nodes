# The HouseGraph API every library here builds against. Bumping this is the reason this is a
# monorepo: one edit rebuilds and re-releases every library, instead of one PR per repository.
#
# Note the coordinate. JitPack documents multi-module projects as
# com.github.<user>.<repo>:<module>:<tag>, and HouseGraph's api module publishes under exactly
# that name — but JitPack found only one artifact in the build and relocated it to the
# repository-level coordinate. So com.github.jaymcole.HouseGraph:housegraph-api 404s and this
# resolves. The artifact named "HouseGraph" *is* housegraph-api; the desktop app has no publication.
#
# This is also what each library records as "apiVersion" in its manifest: the convention plugin
# derives it from the tag here rather than taking a second, hand-maintained property, so the value
# shipped in the jar cannot disagree with the one it was compiled against. The manifest field is
# read for display in the Node Libraries window; nothing gates loading on it today.
houseGraphApi=com.github.jaymcole:HouseGraph:v1.0.2

javafxVersion=21.0.4
