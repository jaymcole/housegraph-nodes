plugins {
    id 'housegraph-node-library'
}

nodeLibrary {
    id = 'housegraph-datetime'
    libraryName = 'Date & Time'
    description = 'Converting between epoch milliseconds and calendar date/time fields.'
    nodePackages = ['io.github.jaymcole.housegraph.plugins.datetime.nodes']
}

// No dependencies — java.time on top of the API.
