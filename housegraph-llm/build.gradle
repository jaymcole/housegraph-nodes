plugins {
    id 'housegraph-node-library'
}

nodeLibrary {
    id = 'housegraph-llm'
    libraryName = 'Local LLM'
    description = 'Runs a language model on this machine - starts the server (Ollama, or any OpenAI-compatible one), pulls a model, and prompts it.'
    nodePackages = ['io.github.jaymcole.housegraph.plugins.llm.nodes']
}

// No dependencies. The server is spoken to over plain HTTP with java.net.http.HttpClient, and
// org.json — the only JSON this needs — comes from housegraph-api (api, compileOnly here). Nothing
// is bundled, so there is nothing to relocate.
