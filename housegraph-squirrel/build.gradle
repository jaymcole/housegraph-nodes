plugins {
    id 'housegraph-node-library'
}

nodeLibrary {
    id = 'housegraph-squirrel'
    libraryName = 'Squirrel Signal'
    description = 'Nodes for small networked devices — an Arduino LED-matrix sign that shows what the camera saw.'
    nodePackages = ['io.github.jaymcole.housegraph.plugins.iot.nodes']
}

// No dependencies. This library talks to its device over plain HTTP with the JDK's own client,
// which is exactly why it went first: it exercises the whole pipeline with nothing else that can
// fail.
